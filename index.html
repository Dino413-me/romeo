<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Game Fixed</title>

<style>
body{
    font-family: Arial;
    background:#0f172a;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#111827;
    padding:20px;
    border-radius:15px;
}

button{
    background:#4f46e5;
    color:white;
    border:none;
    padding:10px 15px;
    margin:5px;
    border-radius:8px;
    cursor:pointer;
}

input{
    padding:10px;
    width:80%;
    border-radius:8px;
    border:none;
    margin-top:10px;
}

.correctBox{
    background:#14532d;
    color:#86efac;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

.wrongBox{
    background:#7f1d1d;
    color:#fca5a5;
    padding:15px;
    border-radius:10px;
    margin-top:15px;
}

.green{
    background:#14532d;
    padding:8px;
    border-radius:8px;
    margin-top:5px;
}

.red{
    background:#991b1b;
    padding:8px;
    border-radius:8px;
    margin-top:5px;
}
</style>
</head>

<body>

<div class="container">

<h1>Study Tool Fixed</h1>

<button onclick="startTyping()">Type Line</button>
<button onclick="startFill()">Fill Blank</button>

<div id="game"></div>
<div id="result"></div>

</div>

<script>

const lines = [
"Two households both alike in dignity",
"In fair Verona where we lay our scene",
"From ancient grudge break to new mutiny",
"Where civil blood makes civil hands unclean"
];

let currentLine = "";

const game = document.getElementById("game");
const result = document.getElementById("result");

//////////////////////
// TYPE MODE
//////////////////////

function startTyping(){

    currentLine = lines[Math.floor(Math.random()*lines.length)];

    game.innerHTML = `
        <h2>Type the line</h2>
        <p>${currentLine}</p>
        <button onclick="hideLine()">Hide</button>
    `;

    result.innerHTML = "";
}

function hideLine(){

    game.innerHTML = `
        <h2>Type it</h2>
        <input id="typeInput">
        <br>
        <button onclick="checkType()">Check</button>
    `;
}

function checkType(){

    const user = document.getElementById("typeInput").value.trim();

    if(user.toLowerCase() === currentLine.toLowerCase()){

        result.innerHTML =
        `<div class="correctBox">Correct!</div>`;

    } else {

        result.innerHTML =
        `<div class="wrongBox">
            Wrong!
            <div class="red">Your answer: ${user}</div>
            <div class="green">Correct: ${currentLine}</div>
        </div>`;
    }
}

//////////////////////
// FILL BLANK MODE
//////////////////////

function startFill(){

    const line = lines[Math.floor(Math.random()*lines.length)];
    const words = line.split(" ");

    const index = Math.floor(Math.random()*words.length);
    const answer = words[index];

    words[index] = "_____";

    game.innerHTML = `
        <h2>Fill the blank</h2>
        <p>${words.join(" ")}</p>
        <input id="fillInput">
        <br>
        <button onclick="checkFill('${answer}')">Check</button>
    `;

    result.innerHTML = "";
}

function checkFill(answer){

    const user = document.getElementById("fillInput").value.trim();

    if(user.toLowerCase() === answer.toLowerCase()){

        result.innerHTML =
        `<div class="correctBox">Correct!</div>`;

    } else {

        result.innerHTML =
        `<div class="wrongBox">
            Wrong!
            <div class="red">Your answer: ${user}</div>
            <div class="green">Correct: ${answer}</div>
        </div>`;
    }
}

</script>

</body>
</html>
