<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shakespeare Study Tool</title>

<style>
body{
    font-family:Arial, sans-serif;
    background:#121212;
    color:white;
    text-align:center;
    padding:20px;
}

.container{
    max-width:1000px;
    margin:auto;
    background:#1e1e1e;
    padding:20px;
    border-radius:15px;
}

button{
    padding:12px 20px;
    margin:8px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    background:#4f46e5;
    color:white;
    font-size:16px;
}

button:hover{
    opacity:0.9;
}

.line{
    background:#2a2a2a;
    margin:10px 0;
    padding:12px;
    border-radius:10px;
    cursor:grab;
}

input{
    padding:12px;
    width:80%;
    border:none;
    border-radius:8px;
    font-size:16px;
}

.choiceBtn{
    display:block;
    width:80%;
    margin:10px auto;
}

#result{
    margin-top:20px;
    font-size:22px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<h1>Romeo & Juliet Study Game</h1>

<button onclick="startOrdering()">Order Lines</button>
<button onclick="startTyping()">Type Entire Line</button>
<button onclick="startFillBlank()">Fill Blank</button>
<button onclick="startMultipleChoice()">Multiple Choice Blank</button>

<div id="game"></div>
<div id="result"></div>

</div>

<script>

const lines = [
"Two households both alike in dignity",
"In fair Verona where we lay our scene",
"From ancient grudge break to new mutiny",
"Where civil blood makes civil hands unclean",
"From forth the fatal loins of these two foes",
"A pair of star crossed lovers take their life",
"Whose misadventured piteous overthrows",
"Doth with their death bury their parents strife",
"The fearful passage of their death marked love",
"And the continuance of their parents rage",
"Which but their childrens end naught could remove",
"Is now the two hours traffic of our stage",
"The which if you with patient ears attend",
"What here shall miss our toil shall strive to mend"
];

const game = document.getElementById("game");
const result = document.getElementById("result");

function shuffle(arr){
    return arr.sort(() => Math.random() - 0.5);
}

//////////////////////////
// ORDER MODE
//////////////////////////

function startOrdering(){

    result.innerHTML = "";
    game.innerHTML = "<h2>Put the lines in order</h2>";

    let shuffled = [...lines];
    shuffle(shuffled);

    shuffled.forEach(line => {

        const div = document.createElement("div");

        div.className = "line";
        div.draggable = true;
        div.innerText = line;

        div.addEventListener("dragstart", dragStart);
        div.addEventListener("dragover", dragOver);
        div.addEventListener("drop", drop);

        game.appendChild(div);
    });

    const btn = document.createElement("button");
    btn.innerText = "Check";
    btn.onclick = checkOrder;

    game.appendChild(btn);
}

let dragged;

function dragStart(){
    dragged = this;
}

function dragOver(e){
    e.preventDefault();
}

function drop(e){

    e.preventDefault();

    if(this !== dragged){

        const all = [...game.querySelectorAll(".line")];

        const draggedIndex = all.indexOf(dragged);
        const targetIndex = all.indexOf(this);

        if(draggedIndex < targetIndex){
            this.after(dragged);
        } else {
            this.before(dragged);
        }
    }
}

function checkOrder(){

    const current = [...game.querySelectorAll(".line")]
    .map(div => div.innerText);

    let score = 0;

    for(let i=0;i<lines.length;i++){

        if(current[i] === lines[i]){
            score++;
        }
    }

    result.innerHTML = `Score: ${score}/${lines.length}`;
}

//////////////////////////
// TYPE ENTIRE LINE
//////////////////////////

let currentLine = "";

function startTyping(){

    result.innerHTML = "";

    currentLine = lines[
        Math.floor(Math.random()*lines.length)
    ];

    game.innerHTML = `
        <h2>Type the Entire Line</h2>
        <p style="font-size:24px;">
            Memorize this:
        </p>

        <p style="font-size:28px; color:#60a5fa;">
            ${currentLine}
        </p>

        <button onclick="hideLine()">
            Hide Line
        </button>
    `;
}

function hideLine(){

    game.innerHTML = `
        <h2>Type the Entire Line</h2>

        <input id="typingInput"
        placeholder="Type the line">

        <br><br>

        <button onclick="checkTyping()">
            Check
        </button>
    `;
}

function checkTyping(){

    const answer =
    document.getElementById("typingInput")
    .value
    .trim()
    .toLowerCase();

    if(answer === currentLine.toLowerCase()){

        result.innerHTML = "Correct!";

    } else {

        result.innerHTML =
        `Wrong!<br><br>
        Correct line:<br>
        ${currentLine}`;
    }
}

//////////////////////////
// FILL BLANK
//////////////////////////

function startFillBlank(){

    result.innerHTML = "";

    const line =
    lines[Math.floor(Math.random()*lines.length)];

    const words = line.split(" ");

    const blankIndex =
    Math.floor(Math.random()*words.length);

    const answer = words[blankIndex];

    words[blankIndex] = "_____";

    game.innerHTML = `
        <h2>Fill in the Blank</h2>

        <p style="font-size:30px;">
            ${words.join(" ")}
        </p>

        <input id="blankInput"
        placeholder="Missing word">

        <br><br>

        <button onclick="checkBlank('${answer.toLowerCase()}')">
            Check
        </button>
    `;
}

function checkBlank(answer){

    const user =
    document.getElementById("blankInput")
    .value
    .trim()
    .toLowerCase();

    if(user === answer){

        result.innerHTML = "Correct!";

    } else {

        result.innerHTML =
        `Wrong! Correct answer: ${answer}`;
    }
}

//////////////////////////
// MULTIPLE CHOICE
//////////////////////////

function startMultipleChoice(){

    result.innerHTML = "";

    const line =
    lines[Math.floor(Math.random()*lines.length)];

    const words = line.split(" ");

    const blankIndex =
    Math.floor(Math.random()*words.length);

    const answer = words[blankIndex];

    words[blankIndex] = "_____";

    let choices = [answer];

    while(choices.length < 4){

        const randomLine =
        lines[Math.floor(Math.random()*lines.length)];

        const randomWords =
        randomLine.split(" ");

        const randomWord =
        randomWords[
            Math.floor(Math.random()*randomWords.length)
        ];

        if(!choices.includes(randomWord)){
            choices.push(randomWord);
        }
    }

    shuffle(choices);

    game.innerHTML = `
        <h2>Multiple Choice Blank</h2>

        <p style="font-size:30px;">
            ${words.join(" ")}
        </p>
    `;

    choices.forEach(choice => {

        const btn = document.createElement("button");

        btn.className = "choiceBtn";

        btn.innerText = choice;

        btn.onclick = () => {

            if(choice.toLowerCase() === answer.toLowerCase()){

                result.innerHTML = "Correct!";

            } else {

                result.innerHTML =
                `Wrong! Correct answer: ${answer}`;
            }
        };

        game.appendChild(btn);
    });
}

</script>

</body>
</html>
